<style>
:root {
  --bg: #fbf7ee; --panel: #fffdf7; --text: #2b2418; --muted: #7a6d57; --line: #e2d8c0;
  --accent: #3b7a3b; --accent-text: #fff; --row-alt: #f6f0e0; --hover: #efe4c6;
  --neg: #b3261e; --pos: #2d6a2d;
  --silver: #8a949c; --gold: #c8960c; --iridium: #7b3fb5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a16; --panel: #24221c; --text: #ece6d6; --muted: #a89d85; --line: #3a362b;
    --accent: #6fb26f; --accent-text: #10200f; --row-alt: #2a271f; --hover: #353022;
    --neg: #ff8a80; --pos: #8fd18f; --silver: #b4bcc3; --gold: #e6b83a; --iridium: #b98af0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.banner { padding: 10px 16px; background: var(--accent); color: var(--accent-text); text-align: center; font-weight: 600; }
header { padding: 14px 16px 0; }
h1 { font-size: 18px; margin: 0 0 10px; }
.tabs, .seasons { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover { background: var(--hover); }
button[aria-pressed="true"], button[aria-selected="true"] {
  background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.tabs button { font-weight: 600; padding: 7px 18px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 16px; }
.controls label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
select, input[type="search"] { font: inherit; color: inherit; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.locations { display: flex; flex-wrap: wrap; gap: 4px 14px; flex-basis: 100%; }
.locations label { gap: 4px; }
.count { margin-left: auto; color: var(--muted); }
.wrap { padding: 0 16px 24px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--panel); cursor: pointer; user-select: none;
  border-bottom: 2px solid var(--line); z-index: 1; }
th:hover { background: var(--hover); }
table.fixed { table-layout: fixed; width: auto; }
table.fixed th, table.fixed td { overflow: hidden; text-overflow: ellipsis; }
.resizer { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; touch-action: none; }
.resizer:hover, .resizer.dragging { background: var(--accent); opacity: .4; }
th .arrow { color: var(--accent); margin-left: 4px; font-size: 11px; }
th.left, td.left { text-align: left; }
th.wrap, td.wrap { white-space: normal; min-width: 160px; }
tbody tr:nth-child(even) { background: var(--row-alt); }
tbody tr:hover { background: var(--hover); }
td.name img { vertical-align: middle; margin-right: 6px; image-rendering: pixelated; }
.neg { color: var(--neg); } .pos { color: var(--pos); }
.muted { color: var(--muted); }
.q-Silver { color: var(--silver); font-weight: 600; } .q-Gold { color: var(--gold); font-weight: 600; }
.q-Iridium { color: var(--iridium); font-weight: 600; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.note { padding: 0 16px 24px; color: var(--muted); font-size: 12px; max-width: 900px; }
.hidden { display: none; }
</style>

const fmtGold = v => v === null ? "—" : v.toLocaleString() + "g";
const fmtNum = v => v === null ? "—" : String(v);
const fmtDec = v => v === null ? "—" : v.toFixed(3);
const fmtSigned = v => v === null ? "—" : (v < 0 ? "−" : "") + Math.abs(v).toLocaleString() + "g";

const fmtPercent = v => v === null ? "—" : v + "%";
const fmtSeasons = v => v.join(", ");

// Tab fields: label, rows, nameKey, columns, filters, sort, note, and optional wrap (keys of long-text
// columns that may wrap onto several lines instead of stretching the table past the window).
// Shared columns for jar and keg: [key, label, formatter, left-aligned, signed-colour]
function processingColumns(withType) {
  const cols = [["item", "Input item", null, true]];
  if (withType) cols.push(["type", "Type", null, true]);
  cols.push(
    ["quality", "Quality", null, true],
    ["input", "Input sell price", fmtGold],
    ["output", "Processed sell price", fmtGold],
    ["gain", "Increase (g)", fmtSigned, false, true],
    ["perMin", "g / minute", v => (v < 0 ? "−" : "") + Math.abs(v).toFixed(3), false, true],
    ["perDay", "≈ g / day", fmtSigned, false, true],
    ["seasons", "Season(s)", fmtSeasons, true]);
  return cols;
}

      ["item", "Input item", null, true], ["type", "Type", null, true], ["input", "Input sell price", fmtGold],
      ["cost", "5 inputs", fmtGold], ["output", "Dried sell price", fmtGold],
      ["gain", "Increase per batch (g)", fmtSigned, false, true],
      ["perMin", "g / minute per original input item", v => v === null ? "—" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(3), false, true],
      ["perDay", "≈ g / day per original input item", fmtPerDay, false, true], ["seasons", "Season(s)", fmtSeasons, true]],
    filters: ["type"], sort: [["perDay", -1]],
    note: "Source: Cornucopia wiki Dehydrator. Each batch takes 5 inputs. Dried Vegetable, Flower and Herb take about 30 hr (1800 min, Cornucopia wiki): Vegetable = 7.5 × base price + 25, Flower and Herb = 10 × base price + 50. Dried Fruit takes 1750 min (≈1 day) and sells for 7.5 × base price + 25 (Stardew Valley Wiki Dried Fruit); Grapes make Raisins at 600g (Fruits page), and I assumed the same 1750 min for Raisins, which neither page states. Regular-quality inputs, no profession applied; the batch increase subtracts the price of all 5 inputs, and g / minute and g / day divide that increase by 5 to give a figure per input item. Vegetables and fruits are the Veg and Fruit rows of the Preserves Jar tab. Hay takes 10 Fiber for 3-8 Hay in about 1 hr and has no sell price.",
  },
};

// Fish location checkboxes: each name is matched as a whole word or phrase inside the wiki's free-text location.
const FISH_LOCATIONS = ["Ocean", "Forest River", "Town River", "Mountain Lake", "Forest Pond", "Forest Waterfalls",
  "Forest Farm", "Secret Woods", "Beach", "Desert", "Sewers", "Mines", "Mutant Bug Lair", "Witch's Swamp",
  "Night Market", "Arrowhead Island", "JojaMart", "Ginger Island", "Volcano Caldera", "Pirate Cove", "Freshwater"];

function locationMatches(text, name) {
  const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("\\b" + escaped + "\\b").test(text);
}

const state = { tab: "crops", season: "All", quality: "Regular", type: "All", locations: [], search: "", sort: [],
  widths: {} };  // widths[tabId][columnKey] = pixels, filled once the user drags a column border
const els = {
  tabs: document.getElementById("tabs"), controls: document.getElementById("controls"),
  table: document.getElementById("table"), empty: document.getElementById("empty"),
  note: document.getElementById("note"),
};

function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem("stardew-tables") || "{}");
    for (const key of ["tab", "season", "quality", "type"]) {
      if (saved[key]) state[key] = saved[key];
    }
    if (Array.isArray(saved.locations)) state.locations = saved.locations.filter(n => FISH_LOCATIONS.includes(n));
    if (!TABS[state.tab]) state.tab = "crops";
  } catch (e) { /* storage unavailable */ }
}
function save() {
  try {
    localStorage.setItem("stardew-tables", JSON.stringify(
      { tab: state.tab, season: state.season, quality: state.quality, type: state.type,
        locations: state.locations }));
  } catch (e) { /* storage unavailable */ }
}

function matchesSeason(row) {
  if (state.season === "All") return true;
  return row.seasons.includes(state.season) || row.seasons.includes("All");
}

function visibleRows() {
  const tab = TABS[state.tab];
  const query = state.search.trim().toLowerCase();
  return tab.rows.filter(row => {
    if (!matchesSeason(row)) return false;
    if (tab.filters && tab.filters.includes("quality") && state.quality !== "All" && row.quality !== state.quality) return false;
    if (tab.filters && tab.filters.includes("type") && state.type !== "All" && row.type !== state.type) return false;
    if (tab.filters && tab.filters.includes("location") && state.locations.length > 0 &&
        !state.locations.some(name => locationMatches(String(row.location), name))) return false;
    if (query && !String(row[tab.nameKey]).toLowerCase().includes(query)) return false;
    return true;
  });
}

function compareValues(a, b, direction) {
  const aMissing = a === null || a === undefined, bMissing = b === null || b === undefined;
  if (aMissing || bMissing) return aMissing === bMissing ? 0 : (aMissing ? 1 : -1); // blanks always last
  if (Array.isArray(a)) { a = a.join(); b = b.join(); }
  if (typeof a === "string") return a.localeCompare(b) * direction;
  if (a === b) return 0;
  return (a < b ? -1 : 1) * direction;
}

function sortedRows(rows) {
  const keys = state.sort.length ? state.sort : TABS[state.tab].sort;
  const qualityOrder = row => QUALITIES.indexOf(row.quality);
  return rows.slice().sort((x, y) => {
    for (const [key, direction] of keys) {
      const result = key === "quality"
        ? (qualityOrder(x) - qualityOrder(y)) * direction
        : compareValues(x[key], y[key], direction);
      if (result !== 0) return result;
    }
    return 0;
  });
}

function makeButton(text, pressed, onClick) {
  const b = document.createElement("button");
  b.textContent = text;
  b.setAttribute("aria-pressed", pressed);
  b.addEventListener("click", onClick);
  return b;
}

function makeSelect(label, options, current, onChange) {
  const wrap = document.createElement("label");
  wrap.append(label + " ");
  const select = document.createElement("select");
  for (const option of options) {
    const o = document.createElement("option");
    o.value = o.textContent = option;
    o.selected = option === current;
    select.append(o);
  }
  select.addEventListener("change", () => onChange(select.value));
  wrap.append(select);
  return wrap;
}

function renderTabs() {
  els.tabs.replaceChildren();
  for (const [id, tab] of Object.entries(TABS)) {
    const b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", id === state.tab);
    b.textContent = tab.label;
    b.addEventListener("click", () => { state.tab = id; state.sort = []; state.type = "All"; save(); render(); });
    els.tabs.append(b);
  }
}

function renderControls(shown, total) {
  const tab = TABS[state.tab];
  els.controls.replaceChildren();

  const seasons = document.createElement("div");
  seasons.className = "seasons";
  for (const name of ["All", ...SEASONS]) {
    seasons.append(makeButton(name === "All" ? "All seasons" : name, state.season === name,
      () => { state.season = name; save(); render(); }));
  }
  els.controls.append(seasons);

  if (tab.filters && tab.filters.includes("quality")) {
    els.controls.append(makeSelect("Quality", ["All", ...QUALITIES], state.quality,
      v => { state.quality = v; save(); render(); }));
  }
  if (tab.filters && tab.filters.includes("type")) {
    const types = ["All", ...new Set(tab.rows.map(r => r.type))];
    els.controls.append(makeSelect("Type", types, state.type, v => { state.type = v; save(); render(); }));
  }

  if (tab.filters && tab.filters.includes("location")) {
    const box = document.createElement("div");
    box.className = "locations";
    for (const name of FISH_LOCATIONS) {
      const label = document.createElement("label");
      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = state.locations.includes(name);
      check.addEventListener("change", () => {
        state.locations = check.checked ? [...state.locations, name] : state.locations.filter(n => n !== name);
        save();
        renderTable();
      });
      label.append(check, name);
      box.append(label);
    }
    els.controls.append(box);
  }

  const search = document.createElement("input");
  search.type = "search";
  search.placeholder = "Search…";
  search.value = state.search;
  search.addEventListener("input", () => { state.search = search.value; renderTable(); updateCount(); });
  els.controls.append(search);

  const count = document.createElement("span");
  count.className = "count";
  count.id = "count";
  els.controls.append(count);
  updateCount();
}

function updateCount() {
  const count = document.getElementById("count");
  if (count) count.textContent = visibleRows().length + " of " + TABS[state.tab].rows.length + " rows";
}

function onHeaderClick(key, event) {
  const current = state.sort.length ? state.sort : TABS[state.tab].sort;
  const existing = current.find(s => s[0] === key);
  // Default direction: text columns ascending, numeric columns descending (biggest first).
  const sample = TABS[state.tab].rows.find(r => r[key] !== null && r[key] !== undefined);
  const firstDirection = typeof (sample && sample[key]) === "string" || Array.isArray(sample && sample[key]) ? 1 : -1;
  if (event.shiftKey && state.sort.length) {
    // Shift+click adds a secondary sort, or flips it if already there.
    state.sort = existing ? state.sort.map(s => s[0] === key ? [key, -s[1]] : s) : [...state.sort, [key, firstDirection]];
  } else {
    const direction = existing && current[0][0] === key ? -current[0][1] : firstDirection;
    state.sort = [[key, direction]];
  }
  renderTable();
}

const QUALITY_ICONS = {
  Silver: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYAgMAAACdGdVrAAAADFBMVEUAAADa3+WgoKBrb3Do16TZAAAAAXRSTlMAQObYZgAAAERJREFUeNpjYGBg+P+BgQGdsg/HoP7/fxX+/z8a9Tc0NDS0Ho1i/jU1bP0BdOpr1sp4dOpv1P5/S+vRqP//DzCDbUCiACVOUO/zjPDhAAAAAElFTkSuQmCC",
  Gold: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYAgMAAACdGdVrAAAADFBMVEUAAAD//xjvyQuuYgBe5zIhAAAAAXRSTlMAQObYZgAAAERJREFUeNpjYGBg+P+BgQGdsg/HoP7/fxX+/z8a9Tc0NDS0Ho1i/jU1bP0BdOpr1sp4dOpv1P5/S+vRqP//DzCDbUCiACVOUO/zjPDhAAAAAElFTkSuQmCC",
  Iridium: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYAgMAAACdGdVrAAAADFBMVEUAAADbZ8SAH+IqCoTkUQv1AAAAAXRSTlMAQObYZgAAAERJREFUeNpjYGBg+P+BgQGdsg/HoP7/fxX+/z8a9Tc0NDS0Ho1i/jU1bP0BdOpr1sp4dOpv1P5/S+vRqP//DzCDbUCiACVOUO/zjPDhAAAAAElFTkSuQmCC",
};

function cellContent(tab, row, column) {
  const [key, , format] = column;
  const td = document.createElement("td");
  const value = row[key];
  if (key === tab.nameKey) {
    td.className = "name left";
    if (row.icon && DATA.icons[row.icon]) {
      const img = document.createElement("img");
      img.src = DATA.icons[row.icon];
      img.width = 24; img.height = 24; img.alt = "";
      td.append(img);
    }
    td.append(value);
    return td;
  }
  td.textContent = format ? format(value) : String(value ?? "");
  if (key === "quality" && QUALITY_ICONS[value]) {
    const star = document.createElement("img");
    star.src = QUALITY_ICONS[value];
    star.width = 16; star.height = 16; star.alt = "";
    star.style.cssText = "vertical-align:middle;margin-left:4px;image-rendering:pixelated";
    td.append(star);
  }
  if (column[3]) td.classList.add("left");
  if (tab.wrap && tab.wrap.includes(key)) td.classList.add("wrap");
  if (key === "quality") td.classList.add("q-" + value);
  if (column[4] && typeof value === "number") td.classList.add(value < 0 ? "neg" : "pos");
  if (value === null) td.classList.add("muted");
  return td;
}

const MIN_COLUMN_WIDTH = 40;

// Applies the saved column widths of the current tab (if any) through a <colgroup> and fixed table layout.
function applyWidths(tab) {
  const widths = state.widths[state.tab];
  els.table.classList.toggle("fixed", Boolean(widths));
  els.table.querySelector("colgroup")?.remove();
  if (!widths) {
    els.table.style.width = "";
    return;
  }
  const colgroup = document.createElement("colgroup");
  let total = 0;
  for (const column of tab.columns) {
    const col = document.createElement("col");
    col.style.width = widths[column[0]] + "px";
    total += widths[column[0]];
    colgroup.append(col);
  }
  els.table.prepend(colgroup);
  els.table.style.width = total + "px";
}

function startResize(event, tab, th, key) {
  event.preventDefault();
  event.stopPropagation();
  if (!state.widths[state.tab]) {
    // First drag on this tab: freeze every column at its current width.
    const widths = {};
    els.table.tHead.querySelectorAll("th").forEach((header, i) => { widths[tab.columns[i][0]] = header.offsetWidth; });
    state.widths[state.tab] = widths;
    applyWidths(tab);
  }
  const handle = event.target;
  handle.setPointerCapture(event.pointerId);
  handle.classList.add("dragging");
  const startX = event.clientX;
  const startWidth = state.widths[state.tab][key];
  const onMove = e => {
    state.widths[state.tab][key] = Math.max(MIN_COLUMN_WIDTH, startWidth + e.clientX - startX);
    applyWidths(tab);
  };
  const onUp = () => {
    handle.classList.remove("dragging");
    handle.removeEventListener("pointermove", onMove);
    handle.removeEventListener("pointerup", onUp);
  };
  handle.addEventListener("pointermove", onMove);
  handle.addEventListener("pointerup", onUp);
}

function renderTable() {
  const tab = TABS[state.tab];
  const rows = sortedRows(visibleRows());
  const active = state.sort.length ? state.sort : tab.sort;

  const headRow = document.createElement("tr");
  for (const column of tab.columns) {
    const th = document.createElement("th");
    if (column[3]) th.className = "left";
    if (tab.wrap && tab.wrap.includes(column[0])) th.classList.add("wrap");
    th.textContent = column[1];
    const position = active.findIndex(s => s[0] === column[0]);
    if (position >= 0) {
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = (active[position][1] < 0 ? "▼" : "▲") + (active.length > 1 ? position + 1 : "");
      th.append(arrow);
    }
    th.addEventListener("click", event => onHeaderClick(column[0], event));
    const resizer = document.createElement("span");
    resizer.className = "resizer";
    resizer.addEventListener("pointerdown", event => startResize(event, tab, th, column[0]));
    resizer.addEventListener("click", event => event.stopPropagation());
    th.append(resizer);
    headRow.append(th);
  }
  els.table.tHead.replaceChildren(headRow);
  applyWidths(tab);

  const body = document.createDocumentFragment();
  for (const row of rows) {
    const tr = document.createElement("tr");
    for (const column of tab.columns) tr.append(cellContent(tab, row, column));
    body.append(tr);
  }
  els.table.tBodies[0].replaceChildren(body);

  els.table.classList.toggle("hidden", rows.length === 0);
  els.empty.classList.toggle("hidden", rows.length !== 0);
  els.empty.textContent = "Nothing in this tab matches " + state.season + " with the current filters.";
  updateCount();
}

function render() {
  const tab = TABS[state.tab];
  renderTabs();
  renderControls();
  renderTable();
  els.note.textContent = tab.note + " Click a header to sort; Shift+click another header to add a secondary sort.";
}

loadSaved();
render();
</script>
</body>
</html>
